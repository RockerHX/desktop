name: Manual Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: false
        type: string
      environment:
        description: Release channel used during build
        required: true
        default: beta
        type: choice
        options:
          - beta
          - production
          - test

permissions:
  contents: read
  id-token: write

jobs:
  package-macos-and-windows:
    name: Package macOS and Windows
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      repository: ${{ github.repository }}
      upload-artifacts: true
      environment: ${{ inputs.environment }}
      sign: false
    secrets: inherit
